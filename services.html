<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
    }

    .services {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .service {
      flex: 1;
      min-width: 200px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .service h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Our Services</h1>
    <p>Here are some of the services we offer.</p>

    <div class="services">
      <div class="service">
        <h2>Web Design</h2>
        <p>We create clean and simple websites.</p>
      </div>

      <div class="service">
        <h2>Web Development</h2>
        <p>We build fast and responsive web applications.</p>
      </div>

      <div class="service">
        <h2>SEO</h2>
        <p>We help improve your website's visibility.</p>
      </div>
    </div>
  </div>

</body>
</html>
