<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
    }

    h1 {
      font-size: 64px;
      margin: 0;
      color: #333;
    }

    p {
      margin: 15px 0 25px;
      color: #666;
    }

    a {
      display: inline-block;
      padding: 10px 15px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    a:hover {
      background: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist.</p>

    <a href="index.html">Go Home</a>
  </div>

</body>
</html>
